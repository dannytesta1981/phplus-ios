name: phplus
options:
  bundleIdPrefix: com.phplus
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    MARKETING_VERSION: 1.2
    CURRENT_PROJECT_VERSION: 3
    ARCHS: arm64
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: phplus
    INFOPLIST_KEY_NSCameraUsageDescription: "Consenti ai siti che autorizzi di usare la fotocamera per la verifica dell’identità. Nessuna immagine viene raccolta dall’app."
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Consenti ai siti che autorizzi di usare il microfono quando richiesto dal loro flusso di verifica."
    INFOPLIST_KEY_NSFaceIDUsageDescription: "Sblocca l'accesso ai tuoi portali privati."
    INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    PRODUCT_BUNDLE_IDENTIFIER: com.phplus.app
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  phplus:
    type: application
    platform: iOS
    sources:
      - path: PrivateHub
    settings:
      base:
        PRODUCT_NAME: phplus
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark

  phplusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOS
    dependencies:
      - target: phplus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phplus.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/phplus.app/phplus"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  phplus:
    build:
      targets:
        phplus: all
    test:
      targets:
        - phplusTests
