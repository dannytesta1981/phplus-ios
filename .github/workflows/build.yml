name: Build phplus IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Permission policy and diagnostics checks
        run: |
          swiftc -parse-as-library PrivateHub/CapturePolicy.swift Tests/CapturePolicyChecks.swift -o /tmp/phplus-policy-checks
          /tmp/phplus-policy-checks
          node Tests/media-diagnostics.test.cjs
          node Tests/media-privacy.test.cjs
      - name: Build iPhone ARM64
        run: |
          set -o pipefail
          xcodebuild -project phplus.xcodeproj -scheme phplus -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build | tee build.log
      - name: Package and verify
        run: |
          mkdir -p dist/Payload
          cp -R build/Build/Products/Release-iphoneos/phplus.app dist/Payload/
          APP=dist/Payload/phplus.app
          test "$(lipo -archs "$APP/phplus")" = arm64
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = 1.3.1
          /usr/libexec/PlistBuddy -c 'Print :NSFaceIDUsageDescription' "$APP/Info.plist"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSCameraUsageDescription' "$APP/Info.plist")"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$APP/Info.plist")"
          test -s "$APP/media-diagnostics.js"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSSupportsLiveActivities' "$APP/Info.plist")" = false
          if /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP/Info.plist"; then exit 1; fi
          strings "$APP/phplus" > dist/binary-strings.txt
          grep -q 'requestMediaCapturePermissionForOrigin:initiatedByFrame:type:decisionHandler:' dist/binary-strings.txt
          grep -q 'setAllowsPictureInPictureMediaPlayback:' dist/binary-strings.txt
          xcrun vtool -show-build "$APP/phplus" | tee dist/verification.txt
          grep -q 'platform IOS' dist/verification.txt
          cd dist
          zip -qry phplus-1.3.1-unsigned.ipa Payload
          unzip -t phplus-1.3.1-unsigned.ipa
          shasum -a 256 phplus-1.3.1-unsigned.ipa > SHA256SUMS.txt
          cd ..
          zip -qry dist/phplus-1.3.1-source.zip PrivateHub phplus.xcodeproj project.yml README.md .github Tests
      - name: Real WebKit and lifecycle tests on iOS 18.5 simulator
        timeout-minutes: 15
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl create phplus-1-3-1-tests com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro com.apple.CoreSimulator.SimRuntime.iOS-18-5)
          echo "$DEVICE" > /tmp/phplus-simulator-id
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          python3 Tests/prepare_https_fixture.py
          xcrun simctl keychain "$DEVICE" add-root-cert /tmp/phplus-root.cer
          python3 Tests/https_fixture.py > fixture.log 2>&1 &
          xcodebuild -project phplus.xcodeproj -scheme phplus -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath test-build -resultBundlePath lifecycle.xcresult -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 IPHONEOS_DEPLOYMENT_TARGET=18.4 CODE_SIGNING_ALLOWED=NO -skip-testing:phplusTests/LifecycleTests/testReadWebStorageAfterRelaunch test | tee tests-write.log
          xcrun simctl terminate "$DEVICE" com.phplus.app || true
          xcodebuild -project phplus.xcodeproj -scheme phplus -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath test-build -resultBundlePath persistence.xcresult -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 IPHONEOS_DEPLOYMENT_TARGET=18.4 CODE_SIGNING_ALLOWED=NO -only-testing:phplusTests/LifecycleTests/testReadWebStorageAfterRelaunch test | tee tests-read.log
          printf 'Simulator: iPhone 16 Pro, iOS 18.5. Two separate XCTest host processes. Simulator-only minimum deployment target 18.4 for WebKit bug 293831; device IPA remains iOS 17+. Physical Face ID/camera and provider identity acceptance: NOT TESTED.\n' > dist/test-scope.txt
      - uses: actions/upload-artifact@v4
        with:
          name: phplus-1.3.1
          path: |
            dist/phplus-1.3.1-unsigned.ipa
            dist/phplus-1.3.1-source.zip
            dist/verification.txt
            dist/SHA256SUMS.txt
            dist/test-scope.txt
            tests-write.log
            tests-read.log
            lifecycle.xcresult
            persistence.xcresult
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: |
            build.log
            tests-write.log
            tests-read.log
            fixture.log
            lifecycle.xcresult
            persistence.xcresult
